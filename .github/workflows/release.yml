name: Release

# Собирает zip для каждого модуля репозитория (module.json в корне и в
# подпапках на один уровень) и публикует их в одном GitHub Release при
# пуше тега vX.Y.Z. Для модуля в корне (visual-novel-reverse) подпапки
# других модулей исключаются из его zip. module.json.download
# (releases/latest/download/<id>.zip) и .manifest (raw module.json на
# main) рассчитаны именно на этот workflow.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v2.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Build module zips
        run: |
          set -euo pipefail
          mkdir -p build
          mapfile -t module_jsons < <(find . -maxdepth 2 -name module.json | sed 's|^\./||' | sort)

          for module_json in "${module_jsons[@]}"; do
            dir=$(dirname "$module_json")
            id=$(jq -r '.id' "$module_json")
            mkdir -p "build/$id"

            if [ "$dir" = "." ]; then
              exclude_args=()
              for other in "${module_jsons[@]}"; do
                other_dir=$(dirname "$other")
                if [ "$other_dir" != "." ]; then
                  exclude_args+=(--exclude="$other_dir")
                fi
              done
              rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='*.DS_Store' \
                "${exclude_args[@]}" ./ "build/$id/"
            else
              rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='*.DS_Store' \
                "$dir/" "build/$id/"
            fi

            (cd build && zip -r "../$id.zip" "$id")
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: "*.zip"
          generate_release_notes: true
